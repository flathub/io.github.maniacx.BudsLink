app-id: io.github.maniacx.BudsLink
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: budslink

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --env=PULSE_PROP_media.category=Manager
  - --system-talk-name=org.bluez
  - --talk-name=org.mpris.MediaPlayer2.*
  - --socket=pulseaudio
  - --device=dri

cleanup:
  - /share/io.github.maniacx.BudsLink/Gvc-1.0.gir

modules:
  - name: BudsLink
    buildsystem: meson
    sources:
      - type: archive
        url: https://github.com/maniacx/BudsLink/releases/download/v0.2.0/BudsLink-v0.2.0.tar.gz
        sha256: 059aecca341579a2ea30dd20cff0cb9374d0b157e1c4317a5fb33e9fb8ac6d07
