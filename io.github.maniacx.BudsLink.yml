app-id: io.github.maniacx.BudsLink
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: budslink

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --env=PULSE_PROP_media.category=Manager
  - --system-talk-name=org.bluez
  - --talk-name=org.mpris.MediaPlayer2.*
  - --socket=pulseaudio
  - --device=dri

cleanup:
  - /share/io.github.maniacx.BudsLink/Gvc-1.0.gir

modules:
  - name: BudsLink
    buildsystem: meson
    sources:
      - type: archive
        url: https://github.com/maniacx/BudsLink/releases/download/v0.2.2/BudsLink-v0.2.2.tar.gz
        sha256: 9655085617a25917abb715793d3d2e4e557ecc22d72d62019e1ca57089aff914
